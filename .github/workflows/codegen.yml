name: Codegen Drift Check

# Garantisce che i tipi TS (src/types/database.ts) seguano lo schema (le migrazioni).
# Pipeline ermetica: migrazioni → Supabase locale → pgTAP → `supabase gen types` → confronto.
#
# - Su una PR: se database.ts non è quello generato, il controllo FALLISCE.
# - Su `main`: se database.ts non è quello generato, la CI lo rigenera e fa lei il commit
#   («chore(codegen): …», autore github-actions[bot]). In locale spesso non c'è Docker, e prima
#   ogni migrazione arrivata su main senza i file rigenerati lasciava il controllo rosso finché
#   qualcuno non li sistemava a mano. Il tag di una versione va creato DOPO quel commit.
#   I push fatti con GITHUB_TOKEN non fanno ripartire i workflow: niente giri infiniti.
#
# Dal 23/11/2026 non si generano più schema.json e modelli Kotlin: servivano solo alla KMP,
# archiviata, ed erano la causa di quasi tutti i fallimenti.
#
# IMPORTANTE: la CLI Supabase è pinnata come devDependency (package.json) e invocata via `npx`,
# così CI e locale generano byte-identici. NON usare `supabase/setup-cli` con `version: latest`:
# versioni diverse della CLI ordinano diversamente gli overload delle RPC in database.ts
# e producono drift fantasma. Per aggiornare la CLI: bump del pin + `npm run codegen` + commit.
# Vedi codegen/README.md e CONTRACT_DISCIPLINE.md.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'codegen/**'
      - 'src/types/database.ts'
      - 'package.json'
      - '.github/workflows/codegen.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'codegen/**'
      - 'src/types/database.ts'
      - 'package.json'
      - '.github/workflows/codegen.yml'

# Due push ravvicinati su main non devono fare il commit dei tipi insieme.
concurrency:
  group: codegen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codegen:
    name: Codegen TS (drift-check)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo per il commit dei tipi rigenerati su main
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install deps (include la CLI Supabase pinnata)
        run: npm ci

      - name: Versione CLI Supabase in uso
        run: npx supabase --version

      - name: Start local Supabase + apply migrations
        run: |
          npx supabase start
          npx supabase db reset --local   # riapplica le migrazioni in modo pulito

      - name: Test del modello di accesso (pgTAP)
        # Fallisce se una migrazione apre ad anon/authenticated funzioni o tabelle fuori elenco.
        # Vedi ACCESS_MODEL.md.
        run: npx supabase test db

      - name: Codegen (tipi TS)
        run: npm run codegen

      - name: Drift check
        id: drift
        run: |
          if git diff --quiet -- src/types/database.ts; then
            echo "✅ Nessun drift: database.ts allineato allo schema."
            exit 0
          fi
          git diff --stat -- src/types/database.ts
          if [ "${{ github.event_name }}" != "push" ]; then
            git diff -- src/types/database.ts
            echo "::error::DRIFT: src/types/database.ts non è allineato allo schema. Rigenera con 'npm run codegen' (richiede Docker) e committalo, oppure mergia: su main la CI lo rigenera da sola."
            exit 1
          fi
          echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Commit dei tipi rigenerati (solo su main)
        if: steps.drift.outputs.drift == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore(codegen): tipi TS rigenerati dalla CI per ${GITHUB_SHA::7}"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::error::Nel frattempo main ha cambiato anche database.ts: rigenera con 'npm run codegen' e committalo a mano."
            exit 1
          fi
          git push origin HEAD:main
          echo "::notice::database.ts era indietro: la CI l'ha rigenerato e committato su main. Crea il tag dopo questo commit."
